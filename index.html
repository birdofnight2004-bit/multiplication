<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جدول الضرب التفاعلي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Tajawal', sans-serif; user-select: none; -webkit-user-select: none; }
    .bg-gradient-custom { background: linear-gradient(135deg, #3730a3 0%, #5b21b6 50%, #1e40af 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); }
    .btn-bounce:active { transform: scale(0.92); }
  </style>
</head>
<body class="bg-gradient-custom min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-6 overflow-x-hidden">

  <!-- Header -->
  <header class="flex justify-between items-center max-w-xl mx-auto w-full mb-4">
    <div class="flex items-center space-x-2 space-x-reverse bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl text-white">
      <span class="text-2xl">⭐</span>
      <span id="totalScore" class="font-bold text-xl">0</span>
    </div>
    <h1 class="text-2xl sm:text-3xl font-black text-white text-center drop-shadow-md">جدول الضرب</h1>
    <button onclick="switchView('home')" class="bg-white/20 backdrop-blur-md hover:bg-white/30 text-white p-2 rounded-2xl transition btn-bounce">
      🏠
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto w-full flex-grow flex flex-col justify-center">
    
    <!-- Home View -->
    <div id="viewHome" class="space-y-4">
      <div class="glass-card rounded-3xl p-6 text-center shadow-2xl border border-white/40">
        <h2 class="text-2xl font-bold text-indigo-950 mb-2">مرحباً بك يا بطل! 👋</h2>
        <p class="text-slate-600 mb-6 font-semibold">اختر النمط المناسب للعب والتعلم اليوم</p>

        <div class="grid grid-cols-1 gap-4">
          <button onclick="switchView('grid')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">📊 جدول الضرب الشامل (1-10)</span>
            <span class="text-2xl">➔</span>
          </button>
          
          <button onclick="switchView('selectPractice')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">🎯 وضع التدريب (10 أسئلة)</span>
            <span class="text-2xl">➔</span>
          </button>

          <button onclick="startChallenge()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">⚡ تحدي الـ 30 ثانية</span>
            <span class="text-2xl">🔥</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Practice Selector -->
    <div id="viewSelectPractice" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-6 text-center shadow-2xl">
        <h2 class="text-xl font-bold text-indigo-950 mb-4">اختر الجدول للتدرب عليه (10 أسئلة):</h2>
        <div class="grid grid-cols-3 gap-3" id="tableButtons"></div>
      </div>
    </div>

    <!-- Quiz View -->
    <div id="viewQuiz" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-6 shadow-2xl text-center relative overflow-hidden">
        
        <!-- Header Info -->
        <div class="flex justify-between items-center mb-3 text-sm font-bold text-slate-600">
          <span id="quizModeTitle" class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">تدريب</span>
          <span id="quizCounter" class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full">السؤال 1 من 10</span>
        </div>

        <!-- Timer Bar for Challenge -->
        <div id="timerContainer" class="w-full bg-slate-200 h-3 rounded-full mb-4 hidden overflow-hidden">
          <div id="timerBar" class="bg-amber-500 h-full w-full transition-all linear duration-1000"></div>
        </div>

        <!-- Question Box (الاتجاه من اليمين إلى اليسار) -->
        <div class="bg-gradient-to-r from-indigo-700 to-purple-800 rounded-2xl p-6 text-white my-4 shadow-md flex items-center justify-between flex-row-reverse" dir="rtl">
          <div class="text-right">
            <span class="text-indigo-200 text-xs block font-bold mb-1">المسألة:</span>
            <div class="text-4xl sm:text-5xl font-black tracking-wider flex items-center gap-2">
              <span id="num1">5</span>
              <span>×</span>
              <span id="num2">1</span>
              <span>=</span>
            </div>
          </div>
          <div class="text-left bg-white/20 px-5 py-3 rounded-2xl backdrop-blur-sm">
            <span class="text-amber-300 text-4xl sm:text-5xl font-black">؟</span>
          </div>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-2 gap-3 my-4" id="optionsGrid"></div>

      </div>
    </div>

    <!-- Result View (شاشة النتيجة مع الوقت المستغرق) -->
    <div id="viewResult" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-8 text-center shadow-2xl">
        <span class="text-6xl mb-4 block">🏆</span>
        <h2 class="text-3xl font-black text-indigo-950 mb-2">أحسنت يا بطل!</h2>
        <p class="text-slate-600 font-bold mb-6">لقد أنهيت التدريب بنجاح</p>
        
        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="bg-indigo-100 rounded-2xl p-4">
            <span class="text-slate-600 block text-xs font-bold mb-1">النقاط المفصلة:</span>
            <span id="resultScore" class="text-3xl font-black text-indigo-700">0</span>
          </div>
          <div class="bg-amber-100 rounded-2xl p-4">
            <span class="text-slate-600 block text-xs font-bold mb-1">الوقت المستغرق:</span>
            <span id="timeTaken" class="text-2xl font-black text-amber-800">0 ثانية</span>
          </div>
        </div>

        <button onclick="switchView('home')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg btn-bounce">
          العودة للرئيسية 🏠
        </button>
      </div>
    </div>

    <!-- Grid View -->
    <div id="viewGrid" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-4 shadow-2xl max-h-[75vh] overflow-y-auto">
        <h2 class="text-center font-bold text-indigo-950 mb-4 text-xl">جدول الضرب الشامل (1 - 10)</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="gridDetailedContainer"></div>
      </div>
    </div>

  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // تشغيل الأصوات مع التحكم بنعومة الصوت الخاطئ
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else {
        // صوت خطأ خفيف وهادئ جداً (Sine wave ونسبة صوت منخفضة)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // تم التخفيف لـ 5%
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    let score = 0;
    let currentQuizMode = 'practice';
    let currentTable = 1;
    let num1Val = 1, num2Val = 1;
    let questionCount = 1;
    let timerInterval = null;
    let timeLeft = 30;
    let startTime = 0; // لحساب وقت البداية

    function switchView(view) {
      clearInterval(timerInterval);
      document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
      if (view === 'home') document.getElementById('viewHome').classList.remove('hidden');
      if (view === 'selectPractice') {
        renderTableButtons();
        document.getElementById('viewSelectPractice').classList.remove('hidden');
      }
      if (view === 'quiz') document.getElementById('viewQuiz').classList.remove('hidden');
      if (view === 'result') document.getElementById('viewResult').classList.remove('hidden');
      if (view === 'grid') {
        renderDetailedGrid();
        document.getElementById('viewGrid').classList.remove('hidden');
      }
    }

    function renderTableButtons() {
      const container = document.getElementById('tableButtons');
      container.innerHTML = '';
      
      const order = [1, 2, 3, 4, 5, 6, 7, 8, 9];
      order.forEach(i => {
        const btn = document.createElement('button');
        btn.className = 'bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-black py-3 rounded-xl border-2 border-indigo-200 text-lg btn-bounce shadow-sm';
        btn.innerText = `جدول ${i}`;
        btn.onclick = () => startPractice(i);
        container.appendChild(btn);
      });

      const btn10 = document.createElement('button');
      btn10.className = 'bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-black py-3 rounded-xl border-2 border-indigo-200 text-lg btn-bounce shadow-sm col-start-2';
      btn10.innerText = `جدول 10`;
      btn10.onclick = () => startPractice(10);
      container.appendChild(btn10);
    }

    function startPractice(tableNum) {
      currentQuizMode = 'practice';
      currentTable = tableNum;
      questionCount = 1;
      startTime = Date.now(); // تسجيل وقت بداية التدريب
      document.getElementById('quizModeTitle').innerText = `جدول ${tableNum}`;
      document.getElementById('timerContainer').classList.add('hidden');
      switchView('quiz');
      generateQuestion();
    }

    function startChallenge() {
      currentQuizMode = 'challenge';
      questionCount = 1;
      timeLeft = 30;
      startTime = Date.now();
      document.getElementById('quizModeTitle').innerText = 'تحدي 30 ثانية 🔥';
      document.getElementById('timerContainer').classList.remove('hidden');
      document.getElementById('timerBar').style.width = '100%';
      switchView('quiz');
      generateQuestion();

      timerInterval = setInterval(() => {
        timeLeft--;
        const percentage = (timeLeft / 30) * 100;
        document.getElementById('timerBar').style.width = `${percentage}%`;
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
      }, 1000);
    }

    function generateQuestion() {
      if (currentQuizMode === 'practice') {
        num1Val = currentTable;
        num2Val = questionCount;
        document.getElementById('quizCounter').innerText = `السؤال ${questionCount} من 10`;
      } else {
        num1Val = Math.floor(Math.random() * 10) + 1;
        num2Val = Math.floor(Math.random() * 10) + 1;
        document.getElementById('quizCounter').innerText = `السؤال ${questionCount}`;
      }

      document.getElementById('num1').innerText = num1Val;
      document.getElementById('num2').innerText = num2Val;

      const correctAnswer = num1Val * num2Val;
      let options = [correctAnswer];

      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 10) + 1) * (Math.floor(Math.random() * 10) + 1);
        if (!options.includes(fake)) options.push(fake);
      }

      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'bg-indigo-100 hover:bg-indigo-200 text-indigo-950 text-2xl font-black py-4 rounded-2xl border-2 border-indigo-200 shadow btn-bounce transition-all';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, correctAnswer, btn);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, element) {
      if (selected === correct) {
        playSound('correct');
        element.classList.remove('bg-indigo-100');
        element.classList.add('bg-emerald-600', 'text-white', 'border-emerald-700');
        score += 10;
        document.getElementById('totalScore').innerText = score;
        confetti({ particleCount: 12, spread: 40, origin: { y: 0.8 } });
      } else {
        playSound('wrong');
        element.classList.remove('bg-indigo-100');
        element.classList.add('bg-rose-600', 'text-white', 'border-rose-700');

        const buttons = document.querySelectorAll('#optionsGrid button');
        buttons.forEach(b => {
          if (parseInt(b.innerText) === correct) {
            b.classList.remove('bg-indigo-100');
            b.classList.add('bg-emerald-600', 'text-white');
          }
        });
      }

      setTimeout(() => {
        if (currentQuizMode === 'practice' && questionCount >= 10) {
          finishQuiz();
        } else {
          questionCount++;
          generateQuestion();
        }
      }, 700);
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      
      // حساب الوقت المستغرق
      const totalTimeSeconds = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(totalTimeSeconds / 60);
      const secs = totalTimeSeconds % 60;
      
      let timeText = "";
      if (mins > 0) {
        timeText = `${mins} دقيقة و ${secs} ثانية`;
      } else {
        timeText = `${secs} ثانية`;
      }

      document.getElementById('resultScore').innerText = score;
      document.getElementById('timeTaken').innerText = timeText;
      
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
      switchView('result');
    }

    function renderDetailedGrid() {
      const container = document.getElementById('gridDetailedContainer');
      container.innerHTML = '';
      
      for (let i = 1; i <= 10; i++) {
        let card = document.createElement('div');
        card.className = 'bg-indigo-100 border-2 border-indigo-200 rounded-2xl p-4 shadow-sm';
        
        let title = `<h3 class="font-bold text-indigo-950 border-b border-indigo-200 pb-2 mb-2 text-center text-lg">جدول الضرب (${i})</h3>`;
        let list = '<div class="space-y-1 text-center font-bold text-slate-800" dir="rtl">';
        
        for (let j = 1; j <= 10; j++) {
          list += `<div class="py-0.5">${i} × ${j} = <span class="text-indigo-700 font-black">${i * j}</span></div>`;
        }
        list += '</div>';
        
        card.innerHTML = title + list;
        container.appendChild(card);
      }
    }

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }
  </script>
</body>
</html>
