<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جدول الضرب التفاعلي</title>

  <!-- PWA Settings for Native App Installation -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="جدول الضرب">
  
  <!-- Web App Manifest embedded directly -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"جدول الضرب التفاعلي","short_name":"جدول الضرب","start_url":".","display":"standalone","background_color":"#4f46e5","theme_color":"#4f46e5","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3771/3771278.png","sizes":"512x512","type":"image/png"}]}'>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Tajawal', sans-serif; user-select: none; -webkit-user-select: none; }
    .bg-gradient-custom { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #2563eb 100%); }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .btn-bounce:active { transform: scale(0.92); }
  </style>
</head>
<body class="bg-gradient-custom min-h-screen text-slate-800 flex flex-col justify-between p-3 sm:p-6 overflow-x-hidden">

  <!-- Header -->
  <header class="flex justify-between items-center max-w-xl mx-auto w-full mb-4">
    <div class="flex items-center space-x-2 space-x-reverse bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl text-white">
      <span class="text-2xl">⭐</span>
      <span id="totalScore" class="font-bold text-xl">0</span>
    </div>
    <h1 class="text-2xl sm:text-3xl font-black text-white text-center drop-shadow-md">جدول الضرب (2 - 10)</h1>
    <button onclick="switchView('home')" class="bg-white/20 backdrop-blur-md hover:bg-white/30 text-white p-2 rounded-2xl transition btn-bounce">
      🏠
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto w-full flex-grow flex flex-col justify-center">
    
    <!-- Home View -->
    <div id="viewHome" class="space-y-4">
      <div class="glass-card rounded-3xl p-6 text-center shadow-2xl border border-white/40">
        <h2 class="text-2xl font-bold text-indigo-950 mb-2">مرحباً بك يا بطل! 👋</h2>
        <p class="text-slate-600 mb-6 font-semibold">اختر النمط المناسب للعب والتعلم اليوم</p>

        <div class="grid grid-cols-1 gap-4">
          <button onclick="switchView('grid')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">📊 جدول الضرب الشامل</span>
            <span class="text-2xl">➔</span>
          </button>
          
          <button onclick="switchView('selectPractice')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">🎯 وضع التدريب (جدول محدد)</span>
            <span class="text-2xl">➔</span>
          </button>

          <button onclick="startChallenge()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-between transition btn-bounce">
            <span class="text-lg">⚡ تحدي الـ 60 ثانية</span>
            <span class="text-2xl">🔥</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Practice Selector -->
    <div id="viewSelectPractice" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-6 text-center shadow-2xl">
        <h2 class="text-xl font-bold text-indigo-950 mb-4">اختر الجدول للتدرب عليه:</h2>
        <div class="grid grid-cols-3 gap-3" id="tableButtons"></div>
      </div>
    </div>

    <!-- Quiz View -->
    <div id="viewQuiz" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-6 shadow-2xl text-center relative overflow-hidden">
        
        <!-- Progress / Mode Info -->
        <div class="flex justify-between items-center mb-4 text-sm font-bold text-slate-500">
          <span id="quizModeTitle" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">تدريب</span>
          <span id="quizCounter" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full">السؤال 1</span>
        </div>

        <!-- Question Box -->
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl p-6 text-white my-4 shadow-inner">
          <div class="text-5xl font-black tracking-wider flex items-center justify-center gap-2" dir="ltr">
            <span id="num1">2</span>
            <span>×</span>
            <span id="num2">3</span>
            <span>=</span>
            <span class="text-amber-300">?</span>
          </div>
        </div>

        <!-- Options Grid -->
        <div class="grid grid-cols-2 gap-3 my-4" id="optionsGrid"></div>

      </div>
    </div>

    <!-- Grid View -->
    <div id="viewGrid" class="hidden space-y-4">
      <div class="glass-card rounded-3xl p-4 shadow-2xl">
        <h2 class="text-center font-bold text-indigo-900 mb-3">جدول الضرب من 2 إلى 10</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-center border-collapse text-sm sm:text-base" id="multiplicationTable"></table>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let score = 0;
    let currentQuizMode = 'practice';
    let currentTable = 2;
    let num1Val = 2, num2Val = 2;
    let questionCount = 0;

    function switchView(view) {
      document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
      if (view === 'home') document.getElementById('viewHome').classList.remove('hidden');
      if (view === 'selectPractice') {
        renderTableButtons();
        document.getElementById('viewSelectPractice').classList.remove('hidden');
      }
      if (view === 'quiz') document.getElementById('viewQuiz').classList.remove('hidden');
      if (view === 'grid') {
        renderGrid();
        document.getElementById('viewGrid').classList.remove('hidden');
      }
    }

    function renderTableButtons() {
      const container = document.getElementById('tableButtons');
      container.innerHTML = '';
      for (let i = 2; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3 rounded-xl border border-indigo-200 text-xl btn-bounce';
        btn.innerText = `جدول ${i}`;
        btn.onclick = () => startPractice(i);
        container.appendChild(btn);
      }
    }

    function startPractice(tableNum) {
      currentQuizMode = 'practice';
      currentTable = tableNum;
      questionCount = 1;
      document.getElementById('quizModeTitle').innerText = `وضع التدريب: جدول ${tableNum}`;
      switchView('quiz');
      generateQuestion();
    }

    function startChallenge() {
      currentQuizMode = 'challenge';
      questionCount = 1;
      document.getElementById('quizModeTitle').innerText = 'تحدي الـ 60 ثانية 🔥';
      switchView('quiz');
      generateQuestion();
    }

    function generateQuestion() {
      if (currentQuizMode === 'practice') {
        num1Val = currentTable;
        num2Val = Math.floor(Math.random() * 9) + 2;
      } else {
        num1Val = Math.floor(Math.random() * 9) + 2;
        num2Val = Math.floor(Math.random() * 9) + 2;
      }

      document.getElementById('num1').innerText = num1Val;
      document.getElementById('num2').innerText = num2Val;
      document.getElementById('quizCounter').innerText = `السؤال ${questionCount}`;

      const correctAnswer = num1Val * num2Val;
      let options = [correctAnswer];

      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 9) + 2) * (Math.floor(Math.random() * 9) + 2);
        if (!options.includes(fake)) options.push(fake);
      }

      options.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'bg-slate-100 hover:bg-slate-200 text-indigo-900 text-2xl font-black py-4 rounded-2xl border-2 border-slate-200 shadow btn-bounce';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, correctAnswer, btn);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, element) {
      if (selected === correct) {
        playSound(587, 0.2);
        element.classList.remove('bg-slate-100');
        element.classList.add('bg-emerald-500', 'text-white');
        score += 10;
        document.getElementById('totalScore').innerText = score;
        confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
      } else {
        playSound(200, 0.3);
        element.classList.remove('bg-slate-100');
        element.classList.add('bg-rose-500', 'text-white');
      }

      setTimeout(() => {
        questionCount++;
        generateQuestion();
      }, 700);
    }

    function renderGrid() {
      const table = document.getElementById('multiplicationTable');
      table.innerHTML = '';
      
      let header = '<tr class="bg-indigo-600 text-white font-bold"><th class="p-2 border">×</th>';
      for (let i = 2; i <= 10; i++) header += `<th class="p-2 border">${i}</th>`;
      header += '</tr>';
      table.innerHTML += header;

      for (let i = 2; i <= 10; i++) {
        let row = `<tr><th class="bg-indigo-100 p-2 border font-bold text-indigo-900">${i}</th>`;
        for (let j = 2; j <= 10; j++) {
          row += `<td class="p-2 border hover:bg-amber-100 transition">${i * j}</td>`;
        }
        row += '</tr>';
        table.innerHTML += row;
      }
    }

    // Register Service Worker dynamically
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }
  </script>
</body>
</html>
